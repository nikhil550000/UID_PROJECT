<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCo - Dashboards</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #047857;
            --secondary-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #0ea5e9;
            --background-color: #ecfdf5;
            --card-bg: #fefce8;
            --card-secondary-bg: #d4f4e2;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --neon-glow: #6ee7b7;
            --card-border: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, var(--background-color), #047857);
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            width: 260px;
            background: linear-gradient(180deg, var(--card-bg), var(--card-secondary-bg));
            box-shadow: -6px 0 20px rgba(0, 0, 0, 0.1);
            padding: 2rem 1.5rem;
            z-index: 100;
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--card-border);
        }

        .sidebar-header h2 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin: 0;
        }

        .sidebar-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
            border-radius: 8px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .sidebar-item:hover {
            background-color: var(--card-secondary-bg);
            color: var(--primary-color);
            transform: translateX(-5px);
            box-shadow: 0 0 10px var(--neon-glow);
            text-decoration: none;
        }

        .sidebar-item.active {
            background: linear-gradient(to right, var(--card-secondary-bg), var(--neon-glow));
            color: var(--text-primary);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(4, 120, 87, 0.2);
        }

        .sidebar-item i {
            width: 30px;
            font-size: 1.2rem;
        }

        /* Main Content */
        .main-content {
            margin-right: 260px;
            padding: 2rem;
        }

        .dashboard-header {
            background: linear-gradient(145deg, var(--card-bg), var(--card-secondary-bg));
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        .metric-card {
            background: linear-gradient(145deg, var(--card-bg), var(--card-secondary-bg));
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .chart-container {
            background: linear-gradient(145deg, var(--card-bg), var(--card-secondary-bg));
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .chart-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .metric-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .trend-indicator {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-left: 1rem;
        }

        .trend-up {
            background-color: var(--secondary-color);
            color: white;
        }

        .trend-down {
            background-color: var(--danger-color);
            color: white;
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>PharmaCo</h2>
        </div>
        <a href="home.html" class="sidebar-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="medicine-list.html" class="sidebar-item">
            <i class="fas fa-pills"></i>
            <span>Medicine List</span>
        </a>
        <a href="dashboards.html" class="sidebar-item active">
            <i class="fas fa-chart-line"></i>
            <span>Dashboards</span>
        </a>
        <a href="tables.html" class="sidebar-item">
            <i class="fas fa-table"></i>
            <span>Tables</span>
        </a>
        <a href="update.html" class="sidebar-item">
            <i class="fas fa-edit"></i>
            <span>Update</span>
        </a>
        <a href="contact.html" class="sidebar-item">
            <i class="fas fa-address-book"></i>
            <span>Contact Details</span>
        </a>
        <a href="index.html" class="sidebar-item">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="dashboard-header">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="mb-0">Analytics Dashboard</h1>
                </div>
                <div class="col-md-6">
                    <div class="d-flex justify-content-end">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-outline-primary">Daily</button>
                            <button type="button" class="btn btn-outline-primary active">Weekly</button>
                            <button type="button" class="btn btn-outline-primary">Monthly</button>
                        </div>
                        <button class="btn btn-primary">
                            <i class="fas fa-download me-2"></i>Export Report
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Key Metrics -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="metric-value">₹2.5M</div>
                            <div class="metric-label">Total Sales</div>
                        </div>
                        <span class="trend-indicator trend-up">
                            <i class="fas fa-arrow-up me-1"></i>12%
                        </span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="metric-value">1,250</div>
                            <div class="metric-label">Active Products</div>
                        </div>
                        <span class="trend-indicator trend-up">
                            <i class="fas fa-arrow-up me-1"></i>5%
                        </span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="metric-value">45</div>
                            <div class="metric-label">Suppliers</div>
                        </div>
                        <span class="trend-indicator trend-up">
                            <i class="fas fa-arrow-up me-1"></i>3%
                        </span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="metric-value">98%</div>
                            <div class="metric-label">Stock Accuracy</div>
                        </div>
                        <span class="trend-indicator trend-down">
                            <i class="fas fa-arrow-down me-1"></i>2%
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row">
            <div class="col-md-8">
                <div class="chart-container">
                    <h4 class="mb-4">Sales Overview</h4>
                    <canvas id="salesChart"></canvas>
                </div>
            </div>
            <div class="col-md-4">
                <div class="chart-container">
                    <h4 class="mb-4">Inventory Distribution</h4>
                    <canvas id="inventoryChart"></canvas>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="chart-container">
                    <h4 class="mb-4">Top Selling Products</h4>
                    <canvas id="topProductsChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="chart-container">
                    <h4 class="mb-4">Supplier Performance</h4>
                    <canvas id="supplierChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sales Overview Chart
        const salesCtx = document.getElementById('salesChart').getContext('2d');
        new Chart(salesCtx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'Sales',
                    data: [1200000, 1900000, 1500000, 2500000, 2200000, 3000000],
                    borderColor: '#047857',
                    backgroundColor: 'rgba(4, 120, 87, 0.1)',
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return '₹' + (value/1000000) + 'M';
                            }
                        }
                    }
                }
            }
        });

        // Inventory Distribution Chart
        const inventoryCtx = document.getElementById('inventoryChart').getContext('2d');
        new Chart(inventoryCtx, {
            type: 'doughnut',
            data: {
                labels: ['Tablets', 'Capsules', 'Syrups', 'Injections'],
                datasets: [{
                    data: [40, 25, 20, 15],
                    backgroundColor: [
                        '#047857',
                        '#10b981',
                        '#f59e0b',
                        '#0ea5e9'
                    ]
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });

        // Top Products Chart
        const topProductsCtx = document.getElementById('topProductsChart').getContext('2d');
        new Chart(topProductsCtx, {
            type: 'bar',
            data: {
                labels: ['Paracetamol', 'Amoxicillin', 'Ibuprofen', 'Omeprazole', 'Metformin'],
                datasets: [{
                    label: 'Units Sold',
                    data: [5000, 4500, 4000, 3500, 3000],
                    backgroundColor: '#047857'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Supplier Performance Chart
        const supplierCtx = document.getElementById('supplierChart').getContext('2d');
        new Chart(supplierCtx, {
            type: 'radar',
            data: {
                labels: ['Delivery Time', 'Quality', 'Price', 'Communication', 'Reliability'],
                datasets: [{
                    label: 'MedSupply Co.',
                    data: [90, 85, 80, 95, 88],
                    backgroundColor: 'rgba(4, 120, 87, 0.2)',
                    borderColor: '#047857',
                    pointBackgroundColor: '#047857'
                }, {
                    label: 'PharmaTech Ltd.',
                    data: [85, 90, 85, 80, 92],
                    backgroundColor: 'rgba(16, 185, 129, 0.2)',
                    borderColor: '#10b981',
                    pointBackgroundColor: '#10b981'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    r: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });
    </script>
</body>
</html>
