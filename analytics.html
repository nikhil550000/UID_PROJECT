<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCo - Analytics</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #047857;
            --secondary-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #0ea5e9;
            --background-color: #ecfdf5;
            --card-bg: #fefce8;
            --card-secondary-bg: #d4f4e2;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --neon-glow: #6ee7b7;
            --card-border: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, var(--background-color), #047857);
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            width: 260px;
            background: linear-gradient(180deg, var(--card-bg), var(--card-secondary-bg));
            box-shadow: -6px 0 20px rgba(0, 0, 0, 0.1);
            padding: 2rem 1.5rem;
            z-index: 100;
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--card-border);
        }

        .sidebar-header h2 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin: 0;
        }

        .sidebar-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
            border-radius: 8px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .sidebar-item:hover {
            background-color: var(--card-secondary-bg);
            color: var(--primary-color);
            transform: translateX(-5px);
            box-shadow: 0 0 10px var(--neon-glow);
            text-decoration: none;
        }

        .sidebar-item.active {
            background: linear-gradient(to right, var(--card-secondary-bg), var(--neon-glow));
            color: var(--text-primary);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(4, 120, 87, 0.2);
        }

        .sidebar-item i {
            width: 30px;
            font-size: 1.2rem;
        }

        /* Main Content */
        .main-content {
            margin-right: 260px;
            padding: 2rem;
        }

        .analytics-card {
            background: linear-gradient(145deg, var(--card-bg), var(--card-secondary-bg));
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        .analytics-card h3 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 1rem;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.25rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .metric-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .trend-indicator {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.9rem;
            margin-left: 0.5rem;
        }

        .trend-up {
            background-color: var(--card-secondary-bg);
            color: var(--primary-color);
        }

        .trend-down {
            background-color: #fee2e2;
            color: var(--danger-color);
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>PharmaCo</h2>
        </div>
        <a href="home.html" class="sidebar-item">
            <i class="fas fa-home"></i>
            <span>Dashboard</span>
        </a>
        <a href="research.html" class="sidebar-item">
            <i class="fas fa-flask"></i>
            <span>Research</span>
        </a>
        <a href="herbal-library.html" class="sidebar-item">
            <i class="fas fa-leaf"></i>
            <span>Herbal Library</span>
        </a>
        <a href="analytics.html" class="sidebar-item active">
            <i class="fas fa-chart-line"></i>
            <span>Analytics</span>
        </a>
        <a href="team.html" class="sidebar-item">
            <i class="fas fa-users"></i>
            <span>Team</span>
        </a>
        <a href="settings.html" class="sidebar-item">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
        </a>
        <a href="index.html" class="sidebar-item">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Analytics Dashboard</h1>
            <div class="d-flex gap-2">
                <div class="input-group" style="width: 300px;">
                    <input type="date" class="form-control" id="startDate">
                    <span class="input-group-text">to</span>
                    <input type="date" class="form-control" id="endDate">
                </div>
                <button class="btn btn-save">
                    <i class="fas fa-download me-2"></i>Export Report
                </button>
            </div>
        </div>

        <!-- Key Metrics -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-value">85%</div>
                    <div class="metric-label">
                        Research Success Rate
                        <span class="trend-indicator trend-up">
                            <i class="fas fa-arrow-up"></i> 5%
                        </span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-value">42</div>
                    <div class="metric-label">
                        Active Projects
                        <span class="trend-indicator trend-up">
                            <i class="fas fa-arrow-up"></i> 3
                        </span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-value">$2.4M</div>
                    <div class="metric-label">
                        Research Funding
                        <span class="trend-indicator trend-up">
                            <i class="fas fa-arrow-up"></i> 12%
                        </span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-value">18</div>
                    <div class="metric-label">
                        Patents Filed
                        <span class="trend-indicator trend-down">
                            <i class="fas fa-arrow-down"></i> 2
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row">
            <div class="col-md-6">
                <div class="analytics-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3>Research Progress</h3>
                        <div class="btn-group">
                            <button type="button" class="btn btn-sm btn-outline-primary active">Daily</button>
                            <button type="button" class="btn btn-sm btn-outline-primary">Weekly</button>
                            <button type="button" class="btn btn-sm btn-outline-primary">Monthly</button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="researchProgressChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="analytics-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3>Herbal Compound Analysis</h3>
                        <button class="btn btn-sm btn-outline-primary" id="downloadChart">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                    <div class="chart-container">
                        <canvas id="compoundAnalysisChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <!-- Chart Initialization -->
    <script>
        // Research Progress Chart
        const researchCtx = document.getElementById('researchProgressChart').getContext('2d');
        const researchChart = new Chart(researchCtx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'Completed Projects',
                    data: [12, 19, 15, 25, 22, 30],
                    borderColor: '#047857',
                    backgroundColor: 'rgba(4, 120, 87, 0.1)',
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    intersect: false,
                    mode: 'index'
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(255, 255, 255, 0.9)',
                        titleColor: '#047857',
                        bodyColor: '#1f2937',
                        borderColor: '#047857',
                        borderWidth: 1
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });

        // Compound Analysis Chart
        const compoundCtx = document.getElementById('compoundAnalysisChart').getContext('2d');
        const compoundChart = new Chart(compoundCtx, {
            type: 'doughnut',
            data: {
                labels: ['Anti-inflammatory', 'Antioxidant', 'Immune Support', 'Other'],
                datasets: [{
                    data: [35, 25, 20, 20],
                    backgroundColor: [
                        '#047857',
                        '#10b981',
                        '#6ee7b7',
                        '#d4f4e2'
                    ]
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom'
                    },
                    tooltip: {
                        backgroundColor: 'rgba(255, 255, 255, 0.9)',
                        titleColor: '#047857',
                        bodyColor: '#1f2937',
                        borderColor: '#047857',
                        borderWidth: 1
                    }
                }
            }
        });

        // Download Chart
        document.getElementById('downloadChart').addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'compound-analysis.png';
            link.href = compoundChart.toBase64Image();
            link.click();
        });

        // Date Range Change Handler
        document.getElementById('startDate').addEventListener('change', updateCharts);
        document.getElementById('endDate').addEventListener('change', updateCharts);

        function updateCharts() {
            // Here you would typically fetch new data based on the selected date range
            // For now, we'll just update the existing data
            researchChart.update();
            compoundChart.update();
        }
    </script>
</body>
</html>
