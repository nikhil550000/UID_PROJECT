<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCo - Production Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #047857;
            --secondary-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #0ea5e9;
            --background-color: #ecfdf5;
            --card-bg: #fefce8;
            --card-secondary-bg: #d4f4e2;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --neon-glow: #6ee7b7;
            --card-border: #10b981;
            --bulletin-bg: #d4f4e2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, var(--background-color), #047857);
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            width: 260px;
            background: linear-gradient(180deg, var(--card-bg), var(--card-secondary-bg));
            box-shadow: -6px 0 20px rgba(0, 0, 0, 0.1);
            padding: 2rem 1.5rem;
            z-index: 100;
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--card-border);
        }

        .sidebar-header h2 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin: 0;
        }

        .sidebar-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
            border-radius: 8px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        /* Sidebar Scroll Behavior */
.sidebar {
    position: fixed;
    right: 0;
    top: 0;
    height: 100vh;
    width: 260px;
    background: linear-gradient(180deg, var(--card-bg), var(--card-secondary-bg));
    box-shadow: -6px 0 20px rgba(0, 0, 0, 0.1);
    padding: 2rem 1.5rem;
    z-index: 100;
    overflow-y: auto; /* Enable scrolling within sidebar */
    scrollbar-width: thin; /* Firefox: slim scrollbar */
    scrollbar-color: var(--primary-color) var(--card-bg); /* Firefox: scrollbar colors */
}

/* Webkit browsers (Chrome, Safari) scrollbar styling */
.sidebar::-webkit-scrollbar {
    width: 8px;
}

.sidebar::-webkit-scrollbar-track {
    background: var(--card-bg);
}

.sidebar::-webkit-scrollbar-thumb {
    background: var(--primary-color);
    border-radius: 4px;
}

.sidebar::-webkit-scrollbar-thumb:hover {
    background: #059669;
}
        .sidebar-item:hover {
            background-color: var(--card-secondary-bg);
            color: var(--primary-color);
            transform: translateX(-5px);
            box-shadow: 0 0 10px var(--neon-glow);
            text-decoration: none;
        }

        .sidebar-item.active {
            background: linear-gradient(to right, var(--card-secondary-bg), var(--neon-glow));
            color: var(--text-primary);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(4, 120, 87, 0.2);
        }

        .sidebar-item i {
            width: 30px;
            font-size: 1.2rem;
        }

        /* Section Titles */
        .section-title {
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--text-primary);
            text-shadow: 0 0 10px var(--neon-glow);
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            width: 50%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--info-color));
            transform: translateX(-50%);
        }

        /* Main Content */
        .main-content {
            margin-right: 260px;
            padding: 2rem;
        }

        /* Futuristic Card */
        .futuristic-card {
            background: linear-gradient(145deg, var(--card-bg), var(--card-secondary-bg));
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            transition: all 0.3s ease;
        }

        .futuristic-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15), 0 0 15px var(--neon-glow);
        }

        /* Form Styling */
        .production-form .form-control,
        .production-form .form-select {
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .production-form .form-control:focus,
        .production-form .form-select:focus {
            border-color: var(--neon-glow);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .production-form .btn {
            background: linear-gradient(45deg, var(--primary-color), var(--info-color));
            border: none;
            border-radius: 25px;
            padding: 0.75rem 2rem;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .production-form .btn:hover {
            box-shadow: 0 0 15px var(--neon-glow);
            transform: translateY(-2px);
        }

        /* Table Styling */
        .production-table {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            border-collapse: separate;
            border-spacing: 0;
        }

        .production-table thead {
            border-radius: 8px 8px 0 0;
            overflow: hidden;
        }

        .production-table th {
            background: var(--primary-color);
            color: #f5f5f5;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 1.1rem;
            text-align: center;
            border-bottom: 2px solid #059669;
            position: relative;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-in;
        }

        .production-table th:not(:last-child) {
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }

        .production-table th:hover {
            background: #059669;
            transform: scale(1.02);
        }

        .production-table th.action {
            text-align: left;
        }

        .production-table td {
            padding: 1rem;
            vertical-align: middle;
            color: var(--text-primary);
            border-bottom: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }

        .production-table tbody tr:nth-child(odd) {
            background: var(--card-bg);
        }

        .production-table tbody tr:nth-child(even) {
            background: #f9f7e0;
        }

        .production-table tbody tr:hover {
            background: var(--card-secondary-bg);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1), 0 0 10px var(--neon-glow);
        }

        .production-table .batch-id,
        .production-table .medicine-name {
            font-weight: 600;
        }

        .production-table .status {
            transition: color 0.3s ease;
        }

        .production-table .status.completed {
            color: var(--secondary-color);
            font-weight: 500;
        }

        .production-table .btn-complete {
            background: linear-gradient(45deg, var(--secondary-color), var(--info-color));
            border: none;
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: white;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .production-table .btn-complete:hover {
            background: linear-gradient(45deg, var(--info-color), var(--secondary-color));
            box-shadow: 0 0 12px var(--neon-glow);
            animation: pulse 1.5s infinite;
        }

        .production-table .btn-complete:active {
            transform: scale(0.95);
        }

        .production-table .btn-complete:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
            box-shadow: none;
            animation: none;
        }

        /* Row Animation */
        .production-table tbody tr {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 var(--neon-glow); }
            70% { box-shadow: 0 0 0 10px rgba(110, 231, 183, 0); }
            100% { box-shadow: 0 0 0 0 rgba(110, 231, 183, 0); }
        }

        /* Filter Styling */
        .filter-section {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .filter-section .form-control,
        .filter-section .form-select {
            max-width: 200px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background: var(--card-bg);
        }

        .filter-section .form-control:focus,
        .filter-section .form-select:focus {
            border-color: var(--neon-glow);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                margin-right: 0;
                padding: 1rem;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                box-shadow: none;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .futuristic-card {
                padding: 1.5rem;
            }

            .production-table th,
            .production-table td {
                padding: 0.7rem;
                font-size: 0.85rem;
            }

            .production-table th {
                font-size: 0.85rem;
                padding: 0.7rem;
            }

            .production-table .btn-complete {
                padding: 0.4rem 0.8rem;
                font-size: 0.85rem;
            }

            .filter-section {
                flex-direction: column;
            }

            .filter-section .form-control,
            .filter-section .form-select {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>PharmaCo</h2>
        </div>
        <a href="home.html" class="sidebar-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="medicine-list.html" class="sidebar-item">
            <i class="fas fa-pills"></i>
            <span>Medicine List</span>
        </a>
        <a href="dashboards.html" class="sidebar-item">
            <i class="fas fa-chart-line"></i>
            <span>Dashboards</span>
        </a>
        <a href="tables.html" class="sidebar-item">
            <i class="fas fa-table"></i>
            <span>Tables</span>
        </a>
        <a href="production.html" class="sidebar-item active">
            <i class="fas fa-industry"></i>
            <span>Production</span>
        </a>
        <a href="raw-materials.html" class="sidebar-item ">
            <i class="fas fa-warehouse"></i>
            <span>Raw Materials</span>
        </a>
        <a href="manage-users.html" class="sidebar-item ">
            <i class="fas fa-users"></i>
            <span>Manage Users</span>
        </a>
        <a href="update.html" class="sidebar-item">
            <i class="fas fa-edit"></i>
            <span>Update</span>
        </a>
        <a href="contact.html" class="sidebar-item">
            <i class="fas fa-address-book"></i>
            <span>Contact Details</span>
        </a>
        <a href="index.html" class="sidebar-item">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Create Production Batch -->
        <section class="my-5">
            <h2 class="section-title text-center">Create Production Batch</h2>
            <div class="futuristic-card production-form">
                <form id="productionForm">
                    <div class="mb-3">
                        <label for="medicine" class="form-label">Medicine</label>
                        <select class="form-select" id="medicine" required>
                            <option value="" disabled selected>Select Medicine</option>
                            <option value="Herbal Pain Relief">Herbal Pain Relief</option>
                            <option value="Echinacea Extract">Echinacea Extract</option>
                            <option value="Ginseng Tonic">Ginseng Tonic</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="quantity" class="form-label">Quantity</label>
                        <input type="number" class="form-control" id="quantity" min="1" required>
                    </div>
                    <div class="mb-3">
                        <label for="startDate" class="form-label">Start Date</label>
                        <input type="date" class="form-control" id="startDate" required>
                    </div>
                    <div class="mb-3">
                        <label for="endDate" class="form-label">Expected End Date</label>
                        <input type="date" class="form-control" id="endDate" required>
                    </div>
                    <div class="mb-3">
                        <label for="staff" class="form-label">Assign Staff</label>
                        <select class="form-select" id="staff" required>
                            <option value="" disabled selected>Select Staff</option>
                            <option value="John Doe">John Doe</option>
                            <option value="Jane Smith">Jane Smith</option>
                            <option value="Mark Lee">Mark Lee</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Create Batch</button>
                </form>
            </div>
        </section>

        <!-- Ongoing Batches -->
        <section class="my-5">
            <h2 class="section-title text-center">Ongoing Batches</h2>
            <div class="futuristic-card">
                <div class="table-responsive">
                    <table class="table production-table">
                        <thead>
                            <tr>
                                <th>Batch ID</th>
                                <th>Medicine Name</th>
                                <th>Start Date</th>
                                <th>ETA</th>
                                <th>Status</th>
                                <th>Quantity</th>
                                <th class="action">Action</th>
                            </tr>
                        </thead>
                        <tbody id="ongoingBatches">
                            <!-- Populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Production History -->
        <section class="my-5">
            <h2 class="section-title text-center">Production History</h2>
            <div class="futuristic-card">
                <div class="filter-section">
                    <input type="date" class="form-control" id="filterStartDate" placeholder="Start Date">
                    <input type="date" class="form-control" id="filterEndDate" placeholder="End Date">
                    <select class="form-select" id="filterMedicine">
                        <option value="">All Medicines</option>
                        <option value="Herbal Pain Relief">Herbal Pain Relief</option>
                        <option value="Echinacea Extract">Echinacea Extract</option>
                        <option value="Ginseng Tonic">Ginseng Tonic</option>
                    </select>
                    <select class="form-select" id="filterStatus">
                        <option value="">All Statuses</option>
                        <option value="In-progress">In-progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="table production-table">
                        <thead>
                            <tr>
                                <th>Batch ID</th>
                                <th>Medicine Name</th>
                                <th>Start Date</th>
                                <th>ETA</th>
                                <th>Status</th>
                                <th>Quantity</th>
                            </tr>
                        </thead>
                        <tbody id="historyBatches">
                            <!-- Populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sample data for demonstration
        let ongoingBatches = [
            { id: 'B001', medicine: 'Herbal Pain Relief', startDate: '2025-05-10', eta: '2025-05-20', status: 'In-progress', quantity: 500 },
            { id: 'B002', medicine: 'Echinacea Extract', startDate: '2025-05-12', eta: '2025-05-22', status: 'In-progress', quantity: 300 }
        ];
        let historyBatches = [
            { id: 'B003', medicine: 'Ginseng Tonic', startDate: '2025-04-01', eta: '2025-04-10', status: 'Completed', quantity: 1000 }
        ];

        // Format date to DD/MM/YYYY
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return `${date.getDate().toString().padStart(2, '0')}/${(date.getMonth() + 1).toString().padStart(2, '0')}/${date.getFullYear()}`;
        }

        // Render ongoing batches
        function renderOngoingBatches() {
            const tbody = document.getElementById('ongoingBatches');
            tbody.innerHTML = '';
            ongoingBatches.forEach(batch => {
                tbody.innerHTML += `
                    <tr>
                        <td class="batch-id">${batch.id}</td>
                        <td class="medicine-name">${batch.medicine}</td>
                        <td>${formatDate(batch.startDate)}</td>
                        <td>${formatDate(batch.eta)}</td>
                        <td class="status ${batch.status.toLowerCase()}">${batch.status}</td>
                        <td>${batch.quantity}</td>
                        <td>
                            <button class="btn-complete" onclick="markComplete('${batch.id}')" ${batch.status === 'Completed' ? 'disabled' : ''}>
                                Mark as Completed
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // Render history batches
        function renderHistoryBatches(filteredBatches = historyBatches) {
            const tbody = document.getElementById('historyBatches');
            tbody.innerHTML = '';
            filteredBatches.forEach(batch => {
                tbody.innerHTML += `
                    <tr>
                        <td class="batch-id">${batch.id}</td>
                        <td class="medicine-name">${batch.medicine}</td>
                        <td>${formatDate(batch.startDate)}</td>
                        <td>${formatDate(batch.eta)}</td>
                        <td class="status ${batch.status.toLowerCase()}">${batch.status}</td>
                        <td>${batch.quantity}</td>
                    </tr>
                `;
            });
        }

        // Create new batch
        document.getElementById('productionForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const medicine = document.getElementById('medicine').value;
            const quantity = document.getElementById('quantity').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const staff = document.getElementById('staff').value;

            if (new Date(startDate) > new Date(endDate)) {
                alert('End date must be after start date');
                return;
            }

            const batchId = `B${(ongoingBatches.length + historyBatches.length + 1).toString().padStart(3, '0')}`;
            ongoingBatches.push({
                id: batchId,
                medicine,
                startDate,
                eta: endDate,
                status: 'In-progress',
                quantity: parseInt(quantity)
            });

            renderOngoingBatches();
            alert(`Batch ${batchId} created for ${medicine}`);
            e.target.reset();
        });

        // Mark batch as completed
        function markComplete(batchId) {
            const batch = ongoingBatches.find(b => b.id === batchId);
            if (batch) {
                batch.status = 'Completed';
                ongoingBatches = ongoingBatches.filter(b => b.id !== batchId);
                historyBatches.push(batch);
                renderOngoingBatches();
                renderHistoryBatches();
                alert(`Batch ${batchId} marked as completed. Stock updated for ${batch.medicine} (+${batch.quantity}).`);
            }
        }

        // Filter history batches
        function filterHistory() {
            const startDate = document.getElementById('filterStartDate').value;
            const endDate = document.getElementById('filterEndDate').value;
            const medicine = document.getElementById('filterMedicine').value;
            const status = document.getElementById('filterStatus').value;

            let filteredBatches = historyBatches;

            if (startDate) {
                filteredBatches = filteredBatches.filter(b => new Date(b.startDate) >= new Date(startDate));
            }
            if (endDate) {
                filteredBatches = filteredBatches.filter(b => new Date(b.eta) <= new Date(endDate));
            }
            if (medicine) {
                filteredBatches = filteredBatches.filter(b => b.medicine === medicine);
            }
            if (status) {
                filteredBatches = filteredBatches.filter(b => b.status === status);
            }

            renderHistoryBatches(filteredBatches);
        }

        // Attach filter event listeners
        document.getElementById('filterStartDate').addEventListener('change', filterHistory);
        document.getElementById('filterEndDate').addEventListener('change', filterHistory);
        document.getElementById('filterMedicine').addEventListener('change', filterHistory);
        document.getElementById('filterStatus').addEventListener('change', filterHistory);

        // Initial render
        renderOngoingBatches();
        renderHistoryBatches();
    </script>
</body>
</html>
